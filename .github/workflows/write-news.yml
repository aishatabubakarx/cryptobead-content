name: Write & Publish Daily News

on:
  schedule:
    # 5 Daily publication slots (UTC):
    # Slot 1: 08:00 UTC (4:00 AM EDT) - Aishat Abubakar
    # Slot 2: 12:00 UTC (8:00 AM EDT) - Rotated Author
    # Slot 3: 16:00 UTC (12:00 PM EDT) - Rotated Author
    # Slot 4: 20:00 UTC (4:00 PM EDT) - Aishat Abubakar
    # Slot 5: 00:00 UTC (8:00 PM EDT) - Rotated Author
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
    - cron: '0 16 * * *'
    - cron: '0 20 * * *'
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      slot:
        description: 'Publication Slot Number (1, 2, 3, 4, or 5)'
        required: false
        default: ''

  push:
    branches: [ main, master ]
    paths:
      - 'automation/write_news.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests pillow python-dotenv

      - name: Write and publish news article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SLOT_ARG=""
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            SLOT_ARG="--slot ${{ github.event.inputs.slot }}"
          fi
          python automation/write_news.py $SLOT_ARG

      - name: Ensure cover image exists
        run: |
          python automation/generate_article_image.py

      - name: Update sitemap
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python automation/update_sitemap.py

      - name: Commit and push article changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news/articles.json news/pending_topics.json news/author_rotation.json news/images/ sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(content): publish new article dispatch [skip ci]" && git push)

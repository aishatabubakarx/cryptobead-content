name: Daily Topic Research

on:
  schedule:
    # Runs at 06:00 UTC daily (2:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'automation/research_topics.py'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests python-dotenv

      - name: Research trending crypto topics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python automation/research_topics.py

      - name: Commit and push updated pending topics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news/pending_topics.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(automation): update researched pending topics [skip ci]" && git push)

name: Update Sitemap & Cloudflare Cache

on:
  schedule:
    # Daily at 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'sitemap.xml'
      - 'automation/update_sitemap.py'
      - 'news/articles.json'
      - 'guides/guides.json'

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update sitemap & trigger Cloudflare purge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python automation/update_sitemap.py

      - name: Commit and push sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(seo): update sitemap.xml [skip ci]" && git push)
